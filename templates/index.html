<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .hover-btn {
            transition: 0.2s;
        }
        .hover-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body data-bs-theme="dark" style="font-family: 'Courier New', Courier, monospace;">
    <div class="container p-0 d-flex flex-column align-items-center justify-content-center" y style="height: 100vh;">
        <h1 class="display-6 text-center fw-bold">QUANTUM CRYPTANALYSIS PROJECT</h1>
        <h1 class="display-4 text-center fw-bold text-success">VISUALISATION WEB PORTAL</h1>
        <h1 class="display-6 text-center fw-bold mb-5">Indian Statistical Institute, Kolkata</h1>

        <div class="row">
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick='openWindow("vigenere/sender", 600, 400); openWindow("vigenere/receiver", 600, 400)'>VIGENERE ENCRYPTION DECRYPTION</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('vigenere/crypt', 900, 600)">VIGENERE CLASSICAL CRYPTANALYSIS</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick='openWindow("hill/sender", 600, 400); openWindow("hill/receiver", 600, 400)'>HILL ENCRYPTION DECRYPTION</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('hill/crypt', 900, 600)">HILL CLASSICAL CRYPTANALYSIS</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('vigenere/bruteforce', 950, 600)">VIGENERE GROVER BRUTEFORCE</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('repsubsearch', 950, 700)">VIGENERE QUANTUM CRYPT STAGE - 1</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('periodkeylendetect', 950, 700)">VIGENERE QUANTUM CRYPT STAGE - 2</button></div>
            <div class="col-md-3"><button class="btn btn-lg btn-outline-light shadow shadow-lg hover-btn border-2 display-6 p-4 m-3" onclick="openWindow('swaptest', 950, 700)">VIGENERE QUANTUM CRYPT STAGE - 3</button></div>
        </div>

    </div>

    <script>
        function openWindow(url, w, h) {
            window.open(`${url}`, "_blank", `width=${w},height=${h},noopener,noreferrer`);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
