<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasiski Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme="dark" style="font-family: 'Courier New', Courier, monospace;">
    <div class="d-flex align-items-center justify-content-center" style="height: 100vh;">
        <div style="width: 75vw;">
            <h1 class="fw-bold">VIGENERE CRYPTANALYSIS</h1>
            <hr>
            
            <!-- Error Message Display -->
            {% if error %}
            <div class="alert alert-danger rounded-0" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <!-- Added Form Tag -->
            <form method="POST">
                <!-- Added name="ciphertext" so Flask can read the input -->
                <textarea name="ciphertext" class="form-control rounded-0 border-1 border-light" placeholder="Enter ciphered message..." id="floatingTextarea2"
                    style="height: 100px">{{ ciphertext if ciphertext else '' }}</textarea>
                
                <!-- Added type="submit" -->
                <button type="submit" class="btn btn-light rounded-0 mt-3">DECIPHER MESSAGE</button>
            </form>

            <!-- Results Display Block -->
            {% if decrypted_message %}
            <div class="mt-4 p-3 border border-light">
                <h5 class="fw-bold text-success">Analysis Complete</h5>
                <p class="mb-1"><strong>Estimated Key Length:</strong> {{ key_length }}</p>
                <p class="mb-1"><strong>Recovered Key:</strong> {{ recovered_key }}</p>
                <hr>
                <p class="mb-0"><strong>Deciphered Message:</strong><br>
                <span style="overflow-wrap: break-word;">{{ decrypted_message }}</span></p>
            </div>
            {% endif %}
        </div>
            
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
