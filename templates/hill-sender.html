<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body data-bs-theme="dark" style="font-family: 'Courier New', Courier, monospace;">
    <div class="d-flex align-items-center justify-content-center" y style="height: 100vh;">
        <form method="POST" style="width: 75vw;">
            <h1 class="fw-bold">HILL SENDER</h1>
            <hr>
            <textarea class="form-control rounded-0 border-1 border-light" placeholder="Enter your message..."
                id="message" name="message" style="height: 100px" required
                oninput="buildMatrix(this, 'matrixContainer')"></textarea>

            <input type="hidden" name="matrix_size" id="matrixSize" value="0">
            <div id="matrixContainer"></div>

            <button class="btn btn-light rounded-0 mt-3" type="submit">SEND MESSAGE</button>
        </form>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
    function cleanLength(str) {
        return str.replace(/[^a-zA-Z]/g, '').length;
    }

    function buildMatrix(source, containerId) {
        const n = cleanLength(source.value);
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        document.getElementById('matrixSize').value = n;

        if (n === 0) {
            return;
        }

        container.insertAdjacentHTML('beforeend',
            `<p class="mb-2 mt-3">Enter the ${n} x ${n} key matrix (letters A-Z):</p>`);

        for (let i = 0; i < n; i++) {
            const row = document.createElement('div');
            row.className = 'd-flex gap-1 mb-1';

            for (let j = 0; j < n; j++) {
                const cell = document.createElement('input');
                cell.type = 'text';
                cell.name = `key_${i}_${j}`;
                cell.maxLength = 1;
                cell.required = true;
                cell.className = 'form-control text-center rounded-0 border-1 border-light';
                cell.style.width = '2.5rem';
                cell.style.textTransform = 'uppercase';
                row.appendChild(cell);
            }

            container.appendChild(row);
        }
    }
    </script>
</body>

</html>
